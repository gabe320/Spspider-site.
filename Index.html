<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIDER.COM</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:white;font-family:Arial,sans-serif}
header{text-align:center;padding:45px 15px}
h1{font-size:48px;color:#ff2020;margin:0;text-shadow:0 0 20px red}
header p{color:#aaa}
main{max-width:850px;margin:auto;padding:20px}
.panel{background:#151515;border:1px solid #333;border-radius:15px;padding:20px;margin-bottom:20px}
button{background:#e71919;color:white;border:0;padding:13px 18px;border-radius:8px;font-weight:bold;margin:5px;cursor:pointer}
textarea{width:100%;height:220px;background:#090909;color:#00ff80;border:1px solid #444;border-radius:9px;padding:12px;resize:vertical}
input{display:none}
</style>
</head>
<body>
<header>
<h1>🕷 SPIDER.COM</h1>
<p>Lua Protection & Obfuscation</p>
</header>
<main>
<div class="panel">
<h2>YOUR LUA SOURCE</h2>
<button onclick="document.getElementById('file').click()">Choose .LUA FILE</button>
<input type="file" id="file" accept=".lua,.txt">
<textarea id="source" placeholder="Paste your Lua script here..."></textarea>
</div>
<div class="panel">
<h2>PROTECTED OUTPUT</h2>
<textarea id="output" readonly placeholder="Your protected script will appear here..."></textarea>
<button onclick="obfuscate()">OBFUSCATE</button>
<button onclick="copyOutput()">COPY</button>
<button onclick="clearAll()">CLEAR</button>
</div>
</main>
<script>
document.getElementById('file').addEventListener('change',function(){
const file=this.files[0];
if(file){const reader=new FileReader();reader.onload=e=>document.getElementById('source').value=e.target.result;reader.readAsText(file);}
});
function obfuscate(){
const source=document.getElementById('source').value;
if(!source.trim()){alert('Add a Lua script first!');return;}
document.getElementById('output').value='SPIDER.COM engine is not connected yet.';
}
function copyOutput(){
const output=document.getElementById('output');
if(!output.value)return alert('Nothing to copy!');
navigator.clipboard.writeText(output.value).then(()=>alert('Copied!'));
}
function clearAll(){
document.getElementById('source').value='';
document.getElementById('output').value='';
}
</script>
</body>
</html>
