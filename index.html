
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPIDER.COM | Lua Protection</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{padding:22px 7%;border-bottom:1px solid #292020;display:flex;align-items:center;gap:12px}
.logo{background:#c40024;color:white;padding:12px;border-radius:10px;font-weight:bold}
header h2{letter-spacing:3px}
main{max-width:950px;margin:45px auto;padding:20px}
h1{font-size:42px}
.red{color:#ed173d}
p{color:#aaa;line-height:1.6}
.panel{background:#151111;border:1px solid #392027;border-radius:14px;padding:22px;margin-top:28px}
input,select,textarea{width:100%;background:#090909;color:white;border:1px solid #493038;border-radius:9px;padding:14px;margin:8px 0}
textarea{height:160px;font-family:monospace;resize:vertical}
button{background:#c40024;color:white;border:0;padding:14px;border-radius:8px;font-weight:bold;margin-top:10px;width:100%;font-size:15px;cursor:pointer}
button:active{background:#850019}
.card{background:#090909;border:1px solid #493038;border-radius:10px;padding:15px;margin-top:12px}
small{color:#888}
footer{text-align:center;padding:35px;color:#777}
</style>
</head>
<body>
<header>
<div class="logo">S</div>
<h2>SPIDER<span class="red">.COM</span></h2>
<a href="https://discord.gg/KKAVhSasp" style="color:#ed173d;margin-left:auto">Discord</a>
</header>

<main>
<h1>Protect Your <span class="red">Lua Code.</span></h1>
<p>Welcome to Spider. An independent Lua code protection project.</p>

<div class="panel">
<h2>Upload Script</h2>

<label>Script Name</label>
<input id="scriptName" placeholder="Enter your script name">

<label>Lua File (2 MB maximum)</label>
<input type="file" id="luaFile" accept=".lua">

<label>Script Access</label>
<select id="scriptType">
<option value="free">FREE SCRIPT</option>
<option value="paid">PAID SCRIPT</option>
</select>

<button onclick="uploadScript()">UPLOAD SCRIPT</button>

<button onclick="window.open('https://discord.gg/KKAVhSasp','_blank')">
PRICE / BUY ACCESS — DISCORD
</button>

<p id="status">Ready to upload.</p>
</div>

<div class="panel">
<h2>My Sources</h2>
<p>Your uploaded scripts appear here.</p>
<div id="mySources"></div>
</div>
</main>

<footer>SPIDER.COM · INDEPENDENT PROJECT</footer>

<script>
let scripts=[];

function uploadScript(){
const name=document.getElementById('scriptName').value.trim();
const file=document.getElementById('luaFile').files[0];
const type=document.getElementById('scriptType').value;
const status=document.getElementById('status');

if(!name){status.textContent='Enter a script name.';return;}
if(!file){status.textContent='Choose a Lua file.';return;}
if(file.size>2097152){status.textContent='Maximum file size is 2 MB.';return;}
if(!file.name.toLowerCase().endsWith('.lua')){status.textContent='Only Lua files allowed.';return;}

const reader=new FileReader();
reader.onload=function(){
const source=reader.result;

scripts.push({
id:Date.now(),
name:name,
type:type,
source:source,
enabled:true
});

renderScripts();
status.textContent='Script uploaded!';
document.getElementById('scriptName').value='';
document.getElementById('luaFile').value='';
};
reader.readAsText(file);
}

function renderScripts(){
const box=document.getElementById('mySources');
box.innerHTML='';

scripts.forEach(script=>{
const card=document.createElement('div');
card.className='card';

const title=document.createElement('h3');
title.textContent=script.name;

const badge=document.createElement('p');
badge.textContent=script.type.toUpperCase()+' SCRIPT';

const edit=document.createElement('button');
edit.textContent='EDIT / UPDATE SOURCE';
edit.onclick=()=>editScript(script.id);

const toggle=document.createElement('button');
toggle.textContent=script.enabled?'DISABLE SCRIPT':'ENABLE SCRIPT';
toggle.onclick=()=>{
script.enabled=!script.enabled;
renderScripts();
};

const del=document.createElement('button');
del.textContent='DELETE SCRIPT';
del.onclick=()=>{
scripts=scripts.filter(s=>s.id!==script.id);
renderScripts();
};

card.append(title,badge,edit,toggle,del);
box.appendChild(card);
});
}

function editScript(id){
const script=scripts.find(s=>s.id===id);
if(!script)return;

const name=prompt('Script name:',script.name);
if(name===null)return;

const fileInput=document.createElement('input');
fileInput.type='file';
fileInput.accept='.lua';

fileInput.onchange=()=>{
const file=fileInput.files[0];
if(!file)return;
if(file.size>2097152){alert('Maximum 2 MB');return;}
if(!file.name.toLowerCase().endsWith('.lua')){alert('Only Lua files');return;}

const reader=new FileReader();
reader.onload=()=>{
script.name=name.trim()||script.name;
script.source=reader.result;
renderScripts();
alert('Source updated!');
};
reader.readAsText(file);
};

fileInput.click();
}
</script>
</body>
</html>
